<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Runner 2026 — AI Game Studio Pro Playable Reference</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05070d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #090e1a;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: monospace;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .hud span { color: #10b981; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 13, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(4px);
    }
    .overlay h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .overlay p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; text-align: center; }
    .btn {
      padding: 12px 28px;
      background: #10b981;
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn:hover { background: #34d399; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="hud">
      <div>SCORE: <span id="scoreVal">0</span></div>
      <div>HIGH: <span id="highVal">0</span></div>
    </div>
    <div id="startOverlay" class="overlay">
      <h1>CYBER RUNNER 2026</h1>
      <p>Tap anywhere or press SPACE to jump.<br>Avoid neon obstacles.</p>
      <button class="btn" id="startBtn">START MISSION</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const highVal = document.getElementById('highVal');
    const overlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');

    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    let highScore = parseInt(localStorage.getItem('cr_high') || '0', 10);
    highVal.textContent = highScore;

    let state = 'MENU';
    let score = 0;
    let speed = 300;
    let spawnTimer = 0;
    let obstacles = [];
    let particles = [];

    const player = {
      x: 80,
      y: 350,
      w: 32,
      h: 32,
      vy: 0,
      gravity: 1200,
      jumpForce: -460,
      grounded: true,
      color: '#10b981'
    };

    function resetGame() {
      score = 0;
      speed = 320;
      obstacles = [];
      particles = [];
      player.y = 350;
      player.vy = 0;
      player.grounded = true;
      scoreVal.textContent = '0';
      state = 'PLAYING';
      overlay.style.display = 'none';
      playBeep(440, 'triangle', 0.2);
    }

    function jump() {
      if (state === 'MENU' || state === 'GAMEOVER') {
        resetGame();
        return;
      }
      if (player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
        playBeep(600, 'sine', 0.12);
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: player.x + 16,
            y: player.y + 32,
            vx: (Math.random() - 0.5) * 80,
            vy: Math.random() * -60,
            life: 0.3,
            color: '#10b981'
          });
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      jump();
    });
    startBtn.addEventListener('click', resetGame);

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (state === 'PLAYING') {
        score += dt * 10;
        scoreVal.textContent = Math.floor(score);
        speed += dt * 8;

        // Player physics
        player.vy += player.gravity * dt;
        player.y += player.vy * dt;
        if (player.y >= 350) {
          player.y = 350;
          player.vy = 0;
          player.grounded = true;
        }

        // Spawn obstacles
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          obstacles.push({
            x: 820,
            y: 350,
            w: 24,
            h: 32 + (Math.random() > 0.5 ? 20 : 0),
            color: '#f43f5e'
          });
          spawnTimer = 1.2 + Math.random() * 1.0 - Math.min(speed / 1000, 0.6);
        }

        // Move obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= speed * dt;

          // AABB Collision
          if (
            player.x < obs.x + obs.w &&
            player.x + player.w > obs.x &&
            player.y < obs.y &&
            player.y + player.h > obs.y - obs.h
          ) {
            // Game Over
            state = 'GAMEOVER';
            playBeep(120, 'sawtooth', 0.4);
            if (score > highScore) {
              highScore = Math.floor(score);
              localStorage.setItem('cr_high', highScore);
              highVal.textContent = highScore;
            }
            overlay.innerHTML = `
              <h1>MISSION FAILED</h1>
              <p>Score: <b style="color:#10b981">${Math.floor(score)}</b> &bull; High: ${highScore}</p>
              <button class="btn" onclick="resetGame()">PLAY AGAIN</button>
            `;
            overlay.style.display = 'flex';
          }

          if (obs.x + obs.w < -20) obstacles.splice(i, 1);
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      // Draw
      ctx.fillStyle = '#070a13';
      ctx.fillRect(0, 0, 800, 450);

      // Grid lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 800; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 450); ctx.stroke();
      }

      // Floor
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 382, 800, 68);
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 382); ctx.lineTo(800, 382); ctx.stroke();

      // Draw Player
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.x + 20, player.y + 8, 6, 6);

      // Draw Obstacles
      for (const obs of obstacles) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y - obs.h + 32, obs.w, obs.h);
      }

      // Draw Particles
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
