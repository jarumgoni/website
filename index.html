<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProChatCommerce - AI Automation & Digital Systems</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    if (lang.indexOf('id') === -1 && window.location.pathname === '/') {
      window.location.replace('/en/');
    } else if (window.location.pathname === '/') {
      window.location.replace('/id/');
    }
  </script>
</head>
<body>
  <div class="container" style="text-align:center; padding-top:100px;">
    <h1>ProChatCommerce</h1>
    <p>Select your language / Pilih bahasa Anda:</p>
    <div style="margin-top:20px;">
      <a href="/id/" class="btn">Bahasa Indonesia</a>
      <a href="/en/" class="btn btn-secondary">English</a>
    </div>
  </div>
</body>
</html>
